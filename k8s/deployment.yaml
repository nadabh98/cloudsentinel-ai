apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsentinel-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudsentinel-api
  template:
    metadata:
      labels:
        app: cloudsentinel-api
    spec:
      containers:
        - name: api
          image: europe-west9-docker.pkg.dev/cloudsentinel-ai-511522/cloud-run-source-deploy/cloudsentinel-api@sha256:b9c78bf680302546c7f96d4f2c6b42d42e76f9e93871a864b5455e86c3001cb7
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
